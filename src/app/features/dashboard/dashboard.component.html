<div class="space-y-8">
  <div class="flex items-center gap-2 text-crypto-neon">
    <i class="lucide-trending-up w-5 h-5"></i>
    <h2 class="text-lg font-bold text-white">Live Market Prices</h2>
    <span class="ml-auto text-xs text-crypto-slate hover:text-crypto-neon cursor-pointer">View All Markets ></span>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (item of assets(); track item.id) {
    <app-price-card [asset]="item" />
    } @empty {
    <p class="text-crypto-slate">No assets found...</p>
    }
  </div>
</div>
