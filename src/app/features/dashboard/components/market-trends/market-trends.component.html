<section class="bg-crypto-surface rounded-2xl border border-slate-800/50 shadow-xl p-6">
  <div class="grid grid-cols-5 gap-4">
    <!-- ASSET COLUMN -->
    <div class="flex flex-col gap-4">
      <div class="text-xs font-semibold text-crypto-slate uppercase tracking-widest pb-4 border-b border-slate-800/30">
        Asset
      </div>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center border border-slate-800 flex-shrink-0">
          <img
            [ngSrc]="asset().iconUrl"
            [alt]="asset().name"
            width="24"
            height="24"
            priority
            class="object-contain"
            (error)="onImageError($event)"
          />
        </div>
        <div class="min-w-0">
          <div class="text-sm font-semibold text-white">{{ asset().name }}</div>
          <div class="text-xs text-crypto-slate uppercase">{{ asset().symbol }}/USDT</div>
        </div>
      </div>
    </div>

    <!-- PRICE COLUMN -->
    <div class="flex flex-col gap-4">
      <div class="text-xs font-semibold text-crypto-slate uppercase tracking-widest pb-4 border-b border-slate-800/30">
        Price
      </div>
      <div class="text-sm font-bold text-white">{{ asset().price | currency }}</div>
    </div>

    <!-- 24H CHANGE COLUMN -->
    <div class="flex flex-col gap-4">
      <div class="text-xs font-semibold text-crypto-slate uppercase tracking-widest pb-4 border-b border-slate-800/30">
        24H Change
      </div>
      <div
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-bold text-xs w-fit"
        [ngClass]="
          asset().change24h >= 0
            ? 'bg-emerald-500/15 text-emerald-400'
            : 'bg-red-500/15 text-red-400'
        "
      >
        <lucide-icon
          [name]="asset().change24h >= 0 ? 'trending-up' : 'trending-down'"
          class="w-3 h-3"
        ></lucide-icon>
        {{ asset().change24h > 0 ? '+' : '' }}{{ asset().change24h }}%
      </div>
    </div>

    <!-- MARKET CAP COLUMN -->
    <div class="flex flex-col gap-4">
      <div class="text-xs font-semibold text-crypto-slate uppercase tracking-widest pb-4 border-b border-slate-800/30">
        Market Cap
      </div>
      <div class="text-sm text-crypto-slate">$1.34T</div>
    </div>

    <!-- CHART COLUMN -->
    <div class="flex flex-col gap-4">
      <div class="text-xs font-semibold text-crypto-slate uppercase tracking-widest pb-4 border-b border-slate-800/30">
        Chart
      </div>
      <div class="w-full h-10">
        <app-chart
          [height]="40"
          [chartData]="asset().sparkline"
          [xAxis]="false"
          [yAxis]="false"
        />
      </div>
    </div>
  </div>
</section>
