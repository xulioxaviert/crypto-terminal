<section class="bg-crypto-surface border border-slate-800/50 p-6 shadow-2xl rounded-3xl">
  <div class="flex items-center justify-between mb-8">
    <div class="space-y-1">
      <h3 class="text-xl font-bold text-white tracking-tight">Market Trends</h3>
      <p class="text-xs text-crypto-slate font-medium">Top movers in the last 24 hours</p>
    </div>
    <button class="text-crypto-neon text-sm font-bold flex items-center gap-1 hover:brightness-110 transition-all">
      View All Assets
      <lucide-icon name="chevron-right" class="w-4 h-4"></lucide-icon>
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-separate border-spacing-y-2">
      <thead>
        <tr class="text-crypto-slate text-[10px] uppercase tracking-[0.2em] font-semibold">
          <th class="px-4 py-2">Asset</th>
          <th class="px-4 py-2 text-right">Price</th>
          <th class="px-4 py-2 text-right">24H Change</th>
          <th class="px-4 py-2 text-right">Market Cap</th>
          <th class="px-4 py-2 text-right">Chart</th>
        </tr>
      </thead>
      <tbody>
        @for (asset of trends(); track asset.symbol) {
          <tr class="group hover:bg-slate-800/20 transition-all duration-300">
            <td class="px-4 py-4 rounded-l-2xl border-y border-l border-transparent group-hover:border-slate-800/50">
              <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center border border-slate-800 group-hover:border-crypto-neon/30 transition-colors">
                  <span class="text-xs font-bold text-white">{{ asset.symbol }}</span>
                </div>
                <div>
                  <div class="text-sm font-bold text-white leading-none mb-1">{{ asset.name }}</div>
                  <div class="text-[10px] text-crypto-slate uppercase font-medium">{{ asset.symbol }} / USDT</div>
                </div>
              </div>
            </td>

            <td class="px-4 py-4 text-right border-y border-transparent group-hover:border-slate-800/50">
              <span class="text-sm font-bold text-white">{{ asset.price| currency }}</span>
            </td>

            <td class="px-4 py-4 text-right border-y border-transparent group-hover:border-slate-800/50">
              <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg font-bold text-[11px]"
                   [ngClass]="asset.change24h >= 0 ? 'bg-crypto-neon/10 text-crypto-neon' : 'bg-crypto-red/10 text-crypto-red'">
                <lucide-icon [name]="asset.change24h >= 0 ? 'trending-up' : 'trending-down'" class="w-3 h-3"></lucide-icon>
                {{ asset.change24h }}%
              </div>
            </td>

            <td class="px-4 py-4 text-right text-xs text-crypto-slate border-y border-transparent group-hover:border-slate-800/50">
              $1.34T
            </td>

            <td class="px-4 py-4 rounded-r-2xl border-y border-r border-transparent group-hover:border-slate-800/50">
              <div class="w-20 h-8 bg-slate-800/30 rounded-md ml-auto animate-pulse">
                <app-chart
                  [height]="35"
                  [chartData]="asset.sparkline"
                />
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
