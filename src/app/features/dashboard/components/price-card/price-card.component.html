<div
  class="bg-crypto-surface border border-slate-800/50 p-8 rounded-3xl hover:border-crypto-neon/30 transition-all group"
>
  <div class="flex items-start gap-4 mb-8">
    <div
      class="w-16 h-16 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center border border-slate-700/50"
    >
      <span class="font-bold text-2xl text-orange-500">{{ asset().symbol.substring(0, 1) }}</span>
    </div>
    <div>
      <h3 class="font-bold text-white text-lg">{{ asset().name }}</h3>
      <p class="text-sm text-crypto-slate">{{ asset().symbol }}</p>
    </div>
  </div>

  <div class="mb-6">
    <span class="text-4xl font-bold text-white tracking-tight">
      {{ asset().price | currency : 'USD' : 'symbol' : '1.2-2' }}
    </span>
  </div>

  <div class="flex items-center gap-4">
    <div
      [class]="isPositive() ? 'bg-crypto-neon/10 border-crypto-neon/20' : 'bg-crypto-red/10 border-crypto-red/20'"
      class="flex items-center gap-2 px-4 py-2 rounded-xl border"
    >
      <lucide-icon
        [name]="isPositive() ? 'trending-up' : 'trending-down'"
        [class]="isPositive() ? 'text-crypto-neon' : 'text-crypto-red'"
        class="text-sm font-bold"
      ></lucide-icon>
      <span
        [class]="isPositive() ? 'text-crypto-neon' : 'text-crypto-red'"
        class="text-sm font-bold"
      >
        {{ isPositive() ? '+' : '' }}{{ asset().change24h }}%
      </span>
    </div>
    <div class="flex-1 h-16 bg-slate-800/30 rounded-xl overflow-hidden relative">
      <div
        class="absolute inset-0 bg-gradient-to-t"
        [class]="isPositive() ? 'from-crypto-neon/30' : 'from-crypto-red/30'"
      ></div>
    </div>
  </div>
</div>
