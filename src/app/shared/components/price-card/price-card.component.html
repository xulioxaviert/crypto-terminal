<div
  class="bg-crypto-surface border border-slate-800/50 p-4 rounded-3xl hover:border-crypto-neon/30 transition-all group"
>
  <div class="flex items-start gap-2 mb-4">
    <div
      class="w-16 h-16 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center border border-slate-700/50"
    >
      <img
      [ngSrc]="asset().iconUrl"
      [alt]="asset().name"
      width="32"
      height="32"
      priority
      class="object-contain"
      (error)="handleImageError($event)"
    >
    </div>
    <div>
      <h3 class="font-bold text-white text-lg">{{ asset().name }}</h3>
      <p class="text-sm text-crypto-slate">{{ asset().symbol }}</p>
    </div>
  </div>

  <div class="mb-2">
    <span class="text-4xl font-bold text-white tracking-tight">
      {{ asset().price | currency : 'USD' : 'symbol' : '1.2-2' }}
    </span>
  </div>

  <div class="grid grid-cols-2 gap-2 items-end">
    <div
      [class]="
        isPositive()
          ? 'bg-crypto-neon/10 border-crypto-neon/20'
          : 'bg-crypto-red/10 border-crypto-red/20'
      "
      class="flex items-center justify-center gap-2 px-4 py-2 rounded-xl border w-full"
      style="height: 40px;"
    >
      <lucide-icon
        [name]="isPositive() ? 'trending-up' : 'trending-down'"
        [class]="isPositive() ? 'text-crypto-neon' : 'text-crypto-red'"
        class="text-sm font-bold"
      ></lucide-icon>
      <span
        [class]="isPositive() ? 'text-crypto-neon' : 'text-crypto-red'"
        class="text-sm font-bold"
      >
        {{ isPositive() ? '+' : '' }}{{ asset().change24h }}%
      </span>
    </div>
    <div class="w-full flex items-end">
      <div class="w-full h-[40px] rounded-xl overflow-hidden flex items-end">
        <app-chart
          [height]="40"
          [chartData]="asset().sparkline"
          [color]="isPositive() ? '#10b981' : '#ef4444'"
        />
      </div>
    </div>
  </div>
</div>
