<aside class="flex flex-col h-full bg-crypto-surface">
  <div class="p-8 mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-crypto-neon rounded-xl flex items-center justify-center shadow-neon-soft">
        <lucide-icon name="monitor" class="text-black" size="20"></lucide-icon>
      </div>
      <span class="text-2xl font-bold tracking-tight">CryptoTerminal</span>
    </div>
  </div>

  <nav class="flex-1 px-4 space-y-2">
    @for (item of menuItems(); track item.label) {
      <a [routerLink]="item.route"
         routerLinkActive="bg-gradient-to-r !from-crypto-neon/30 to-crypto-neon/10 text-crypto-neon border-l-4 !border-crypto-neon"
         class="flex items-center gap-4 px-4 py-3 rounded-2xl text-crypto-slate hover:bg-slate-800/50 hover:text-white transition-all">
        <lucide-icon [name]="item.icon.replace('lucide-', '')" size="20"></lucide-icon>
        <span class="font-medium">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="p-6 mt-auto">
    <div class="p-4 bg-crypto-bg/40 border border-slate-800 rounded-3xl flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-slate-700 to-slate-500 border border-slate-600"></div>
      <div>
        <p class="text-sm font-bold">John Doe</p>
        <p class="text-[10px] text-crypto-slate uppercase">Pro Account</p>
      </div>
      <lucide-icon name="log-out" class="ml-auto text-crypto-slate hover:text-crypto-red cursor-pointer" size="18"></lucide-icon>
    </div>
  </div>
</aside>
