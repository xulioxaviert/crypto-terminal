<header
  class="h-20 border-b border-slate-800/50 bg-crypto-dark/50 backdrop-blur-md px-8 flex items-center justify-between sticky top-0 z-50"
>
  <div class="flex flex-col">
    <h1 class="text-xl font-bold text-white tracking-tight">Market Overview</h1>
    <nav
      class="flex items-center gap-2 text-[10px] font-medium uppercase tracking-widest text-crypto-slate"
    >
      <span>{{ currentRoute.parent }}</span>
      <lucide-icon name="chevron-right" class="w-3 h-3"></lucide-icon>
      <span class="text-crypto-neon">{{ currentRoute.child }}</span>
    </nav>
  </div>

  <div class="hidden lg:flex relative md:items-end group">
    <app-header-search />

    <div class="flex items-center gap-3 ml-4">
      <div class="hidden xl:flex items-center gap-2">
        <label class="text-xs text-crypto-slate">Currency</label>
        <select
          [value]="preferences().currency"
          (change)="onCurrencyChange($any($event.target).value)"
          class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-crypto-neon"
        >
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="JPY">JPY</option>
        </select>
      </div>

      <button
        type="button"
        (click)="cycleTheme()"
        class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 transition-all"
        [attr.aria-label]="'Theme ' + themeLabel()"
      >
        <lucide-icon [name]="themeIcon()" class="w-5 h-5"></lucide-icon>
      </button>

      <button
        class="relative p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 transition-all"
      >
        <lucide-icon name="bell" class="w-5 h-5"></lucide-icon>
        <span
          class="absolute top-2.5 right-2.5 w-2 h-2 bg-crypto-red rounded-full border-2 border-slate-900"
        ></span>
      </button>

      <div class="hidden md:flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-800 bg-slate-900 text-xs text-crypto-slate">
        <lucide-icon name="bookmark" size="16"></lucide-icon>
        <span>Watchlist</span>
        <span class="px-2 py-0.5 rounded-md bg-crypto-neon/15 text-crypto-neon font-semibold">
          {{ watchlistCount() }}
        </span>
      </div>
    </div>
  </div>
</header>
